<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      height: 100vh;
      width: 100vw;
      position: relative;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }

    /* Name label – stays near the character */
    .name {
      position: absolute;
      color: #e6a800;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      opacity: 0.9;
      transition: all 0.7s cubic-bezier(0.34, 1.2, 0.64, 1);
      pointer-events: none;
      z-index: 10;
    }

    /* Centered position for the name */
    .name.center {
      top: calc(50% - 160px);
      left: 50%;
      transform: translateX(-50%);
    }

    /* Top-left position for the name */
    .name.corner {
      top: 28px;
      left: 38px;
      transform: translateX(0) scale(0.85);
      font-size: 1.25rem;
    }

    /* The whole character stage */
    .stage {
      position: absolute;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.75s cubic-bezier(0.34, 1.15, 0.64, 1);
      z-index: 5;
      cursor: pointer;
    }

    /* Default: centered */
    .stage.center {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Moved to top-left corner, slightly smaller */
    .stage.corner {
      top: 70px;
      left: 30px;
      transform: translate(0, 0) scale(0.72);
    }

    /* Soft floor glow */
    .glow-floor {
      position: absolute;
      bottom: 8px;
      width: 130px;
      height: 28px;
      background: radial-gradient(ellipse at center,
        rgba(255, 190, 30, 0.42) 0%,
        rgba(255, 170, 0, 0.16) 45%,
        transparent 75%);
      border-radius: 50%;
      filter: blur(7px);
      animation: floorPulse 3.4s ease-in-out infinite;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    @keyframes floorPulse {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50%      { transform: scale(1.15); opacity: 0.95; }
    }

    /* Floating wrapper */
    .ball-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      animation: float 3.8s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    /* When in corner, a gentler smaller float */
    .stage.corner .ball-wrap {
      animation: floatCorner 4.2s ease-in-out infinite;
    }

    @keyframes floatCorner {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }

    /* The yellow ball */
    .ball {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%,
        #fff0a0 0%,
        #ffd84d 28%,
        #ffc107 58%,
        #f0a000 100%);
      box-shadow:
        0 0 32px 5px rgba(255, 190, 40, 0.32),
        0 0 65px 16px rgba(255, 170, 0, 0.13),
        inset 0 -12px 26px rgba(180, 100, 0, 0.2),
        inset 0 12px 20px rgba(255, 255, 220, 0.38);
      position: relative;
      animation: ballPulse 3.4s ease-in-out infinite;
    }

    @keyframes ballPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    /* Eyes */
    .eyes {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 28px;
      transition: all 0.3s ease;
    }

    .eye {
      width: 17px;
      height: 32px;
      background: #fff;
      border-radius: 9px;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.45);
      transition: all 0.25s ease;
      transform-origin: center;
    }

    .eye.blink {
      animation: blink 0.26s ease;
    }

    @keyframes blink {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(0.08); }
    }

    /* Thinking expression (slightly looking up-left) */
    .eyes.thinking {
      transform: translate(calc(-50% - 6px), calc(-50% - 5px));
    }

    .eyes.thinking .eye {
      height: 28px;
    }

    /* Highlight */
    .highlight {
      position: absolute;
      top: 22px;
      left: 36px;
      width: 38px;
      height: 22px;
      background: rgba(255, 255, 255, 0.36);
      border-radius: 50%;
      filter: blur(4px);
      transform: rotate(-28deg);
      pointer-events: none;
    }

    .hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 0.88rem;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.55;
      transition: opacity 0.4s ease;
    }

    .hint strong {
      color: #777;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="name center" id="name">Evia</div>

  <div class="stage center" id="stage">
    <div class="glow-floor"></div>
    <div class="ball-wrap" id="ballWrap">
      <div class="ball">
        <div class="highlight"></div>
        <div class="eyes" id="eyes">
          <div class="eye" id="eyeL"></div>
          <div class="eye" id="eyeR"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">
    Click Evia to send her to the corner<br>
    <strong>Click again to bring her back</strong>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const nameEl = document.getElementById('name');
    const eyes = document.getElementById('eyes');
    const eyeL = document.getElementById('eyeL');
    const eyeR = document.getElementById('eyeR');
    const hint = document.getElementById('hint');

    let inCorner = false;
    let isAnimating = false;

    // Idle blink
    function scheduleBlink() {
      const delay = 2600 + Math.random() * 3200;
      setTimeout(() => {
        if (!isAnimating) {
          eyeL.classList.add('blink');
          eyeR.classList.add('blink');
          setTimeout(() => {
            eyeL.classList.remove('blink');
            eyeR.classList.remove('blink');
          }, 260);
        }
        scheduleBlink();
      }, delay);
    }
    scheduleBlink();

    // Subtle eye drift only when centered
    setInterval(() => {
      if (inCorner || isAnimating) return;
      const x = (Math.random() - 0.5) * 7;
      const y = (Math.random() - 0.5) * 4;
      eyes.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      setTimeout(() => {
        if (!inCorner) {
          eyes.style.transform = 'translate(-50%, -50%)';
        }
      }, 450 + Math.random() * 350);
    }, 4200 + Math.random() * 2500);

    function toggle() {
      if (isAnimating) return;
      isAnimating = true;

      inCorner = !inCorner;

      if (inCorner) {
        // Go to top-left corner
        stage.classList.remove('center');
        stage.classList.add('corner');
        nameEl.classList.remove('center');
        nameEl.classList.add('corner');

        eyes.classList.add('thinking');
        hint.innerHTML = 'Click Evia to bring her back to the centre<br><strong>She’s thinking up here…</strong>';
      } else {
        // Return to centre
        stage.classList.remove('corner');
        stage.classList.add('center');
        nameEl.classList.remove('corner');
        nameEl.classList.add('center');

        eyes.classList.remove('thinking');
        eyes.style.transform = 'translate(-50%, -50%)';
        hint.innerHTML = 'Click Evia to send her to the corner<br><strong>Click again to bring her back</strong>';
      }

      // Allow next click after the transition finishes
      setTimeout(() => {
        isAnimating = false;
      }, 780);
    }

    stage.addEventListener('click', toggle);
    stage.addEventListener('touchstart', (e) => {
      e.preventDefault();
      toggle();
    }, { passive: false });
  </script>
</body>
</html>
